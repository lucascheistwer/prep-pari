# Secretos y modelos vienen del entorno. Este archivo no guarda credenciales.
spring:
  flyway:
    enabled: false

preppari:
  auth:
    dev-login-enabled: false
    cookie-secure: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p logger=%logger{36} traceId=%X{traceId} %m%n"
