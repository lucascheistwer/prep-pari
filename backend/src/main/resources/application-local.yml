# Desarrollo en el host o contenedor de la API. Un solo proceso corre migraciones.
spring:
  flyway:
    enabled: true

preppari:
  runtime:
    mode: api
  ai:
    provider: fake
  auth:
    dev-login-enabled: true
    session-secret: ${PREPPARI_SESSION_SECRET:local-dev-session-secret-not-for-production-00}

logging:
  level:
    com.preppari: INFO
